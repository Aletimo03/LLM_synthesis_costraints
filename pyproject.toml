[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-synthesis-constraints"
version = "0.1.0"
description = "Validation framework for LLM-generated ASIC synthesis constraints."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]
exclude = ["runs*", "results*", ".venv*"]
